<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found</title>
    <script>
      (function() {
        var pathname = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        var redirectUrl = pathname + search + hash;
        try {
          localStorage.setItem('redirectUrl', redirectUrl);
        } catch (e) {
          console.warn('无法存储重定向 URL:', e);
        }
        
        var pathSegments = pathname.split('/').filter(function(s) { return s && s !== 'index.html'; });
        var basePath = '/';
        if (pathSegments.length > 0) {
          basePath = '/' + pathSegments[0] + '/';
        }
        
        var newLocation = window.location.protocol + '//' + window.location.hostname;
        if (window.location.port) {
          newLocation += ':' + window.location.port;
        }
        newLocation += basePath;
        
        console.log('重定向到:', newLocation);
        
        window.location.replace(newLocation);
      })();
    </script>
  </head>
  <body>
    <h1>Redirecting...</h1>
    <p>If you are not redirected automatically, <a href="/">click here</a>.</p>
  </body>
</html>
